name: Live market sample

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-market.yml'
      - 'requirements-live.txt'
      - 'src/pumpfun_lab/live.py'
      - 'src/pumpfun_lab/live_report.py'
      - 'src/pumpfun_lab/cli.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery is free; trades is metered data with paper replay'
        type: choice
        options: [discovery, trades]
        default: discovery
      duration_seconds:
        description: 'Capture duration, 1 to 900 seconds'
        type: number
        default: 300
      max_messages:
        description: 'Local message stop limit, 1 to 10000; not a billing guarantee'
        type: number
        default: 1000
      max_tokens:
        description: 'First new tokens to follow in trades mode, 1 to 20'
        type: number
        default: 10
      accept_data_charges:
        description: 'I authorize PumpPortal metered data charges for this run'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize all live jobs in this repository; never open a socket per token.
concurrency:
  group: pumpportal-live-market
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      CAPTURE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.duration_seconds) || '90' }}
      MAX_MESSAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_messages) || '1000' }}
      MAX_TOKENS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_tokens) || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned live-feed transport
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Verify data and accounting boundaries
        run: python -m unittest discover -s tests -v
      - name: Capture free discovery events
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'discovery'
        run: >-
          python -m pumpfun_lab live --mode discovery
          --duration-seconds "$CAPTURE_SECONDS" --max-messages "$MAX_MESSAGES"
          --max-tokens "$MAX_TOKENS" --output output/live
      - name: Capture explicitly authorized metered trade data
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trades'
        env:
          PUMPPORTAL_API_KEY: ${{ secrets.PUMPPORTAL_API_KEY }}
          ACCEPT_DATA_CHARGES: ${{ inputs.accept_data_charges }}
        run: |
          if [ "$ACCEPT_DATA_CHARGES" != "true" ]; then
            echo 'Metered mode needs explicit acceptance of data charges.' >&2
            exit 2
          fi
          python -m pumpfun_lab live --mode trades --accept-data-charges \
            --duration-seconds "$CAPTURE_SECONDS" --max-messages "$MAX_MESSAGES" \
            --max-tokens "$MAX_TOKENS" --output output/live
      - name: Summarize actual capture evidence
        if: always()
        run: |
          if [ -f output/live/report.md ]; then
            cat output/live/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No capture report was produced. Inspect the failed setup or validation step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized market report for seven days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-market-report
          path: |
            output/live/report.json
            output/live/report.md
            output/live/report.html
            output/live/events.jsonl
          retention-days: 7
          if-no-files-found: warn
