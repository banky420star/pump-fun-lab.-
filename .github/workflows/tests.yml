name: Paper research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-27
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run accounting, wallet and replay tests
        run: python -m unittest discover -s tests -v
      - name: Generate offline research report
        run: python -m pumpfun_lab demo --output output/demo
      - name: Add comparison to job summary
        run: cat output/demo/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain report for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paper-research-report
          path: output/demo/
          retention-days: 7
          if-no-files-found: error
