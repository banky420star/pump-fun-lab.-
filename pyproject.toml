[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-lab"
version = "0.1.0"
description = "Paper-only Pump.fun research and read-only wallet reconciliation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pumpfun-lab = "pumpfun_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
